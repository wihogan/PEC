# forward_eps_seed.yaml — Seed data for the NTM forward EPS history cache.
#
# Purpose
# -------
# spglobal.py uses this file to bootstrap .cache/forward_eps_ntm_history.json
# on the first run (or if the cache is empty). Once the cache exists, ongoing
# refresh runs extend it by one entry per month automatically.
#
# Values represent the S&P 500 NTM (next-twelve-months) forward consensus
# operating EPS in dollars per share, as of the last business or calendar day
# of each month.
#
# Sources / methodology
# ---------------------
# Jan 2021 – Apr 2021:  Estimated (no published anchor available; interpolated
#                       from surrounding known values).
# May 2021 – Apr 2026:  Yardeni Research / LSEG I/B/E/S / S&P Dow Jones Indices
#                       weekly forward-operating-EPS series, digitized/interpolated
#                       from published chart values; 2024–2026 anchored to FactSet
#                       Earnings Insight and Yardeni published chart data.
#
# Key published anchors used to validate this series:
#   Yardeni Forward EPS      Apr 23 2026 = $344.30
#   Yardeni 52-Wk Fwd EPS   Apr 30 2026 = $346.19
#
# Current live override (as of 2026-11-20): $419.64
# Source: FactSet Earnings Insight, price / forward 12M P/E (docs/eps-backfill.md).
# From 2026-11 the refresh workflow fills new months automatically from FactSet.
#
# Format: date is last business/calendar day of month (YYYY-MM-DD), value is $.

