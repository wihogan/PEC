# Manual test of the Telegram alert path (Phase 4). Sends one message.
name: alert-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alert-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '✅ PEC alert test from GitHub Actions (run %s)\n' "$RUN_URL" > msg.txt
          tools/notify_telegram.sh msg.txt
