name: probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "event=${{ github.event_name }} actor=${{ github.actor }}"
          if [ -n "$FRED_API_KEY" ]; then echo "FRED_API_KEY: present (len ${#FRED_API_KEY})"; else echo "FRED_API_KEY: MISSING"; fi
          date; TZ=America/Los_Angeles date
