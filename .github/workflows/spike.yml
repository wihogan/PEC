# Phase 3 connectivity spike (plan.md Phase 3, review B9). Deleted at Phase 4 exit.
name: spike

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spike
  cancel-in-progress: false

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Los_Angeles
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record start
        run: echo "SPIKE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Refresh (real pipeline, cold checkout)
        id: refresh
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          timeout 1140 python refresh_v2.py --force 2>&1 | tee refresh.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > refresh_rc.txt
          exit "$rc"

      - name: Summarise
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          now=$(date +%s)
          elapsed=$((now - SPIKE_START))
          rc=$(cat refresh_rc.txt 2>/dev/null || echo 124)
          touch refresh.log
          python tools/spike_summary.py "$RUN_ID" "$EVENT_NAME" "$elapsed" "$rc"

      - name: Download Treasury XML fixture candidate
        if: always()
        continue-on-error: true
        run: |
          curl -sS --max-time 60 -o treasury_2025.xml "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value=2025"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-${{ github.run_id }}
          path: |
            treasury_2025.xml
            refresh.log
          if-no-files-found: warn
          retention-days: 7

      - name: One-off cleanup of probe-branch
        if: always()
        continue-on-error: true
        run: git push origin --delete probe-branch || true

      - name: Append result to spike-results branch
        if: always()
        run: |
          set -u
          [ -s spike_line.json ] || { echo "no spike_line.json; nothing to record"; exit 1; }
          cp spike_line.json "$RUNNER_TEMP/spike_line.json"
          WT="$RUNNER_TEMP/sr"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898579+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin spike-results >/dev/null 2>&1; then
            git fetch origin spike-results
            git worktree add -B spike-results "$WT" FETCH_HEAD
            EXISTS=1
          else
            git worktree add --detach "$WT"
            (cd "$WT" && git checkout --orphan spike-results && git rm -rf . -q)
            EXISTS=0
          fi
          cd "$WT"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ] || [ "$EXISTS" = 1 ]; then
              if git ls-remote --exit-code --heads origin spike-results >/dev/null 2>&1; then
                git fetch origin spike-results
                git reset -q --hard FETCH_HEAD
              fi
            fi
            cat "$RUNNER_TEMP/spike_line.json" >> spike-results.jsonl
            git add spike-results.jsonl
            git commit -q -m "spike result ${GITHUB_RUN_ID}"
            if git push origin HEAD:refs/heads/spike-results; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push failed (attempt $attempt); retrying"
            sleep $((attempt * 3))
          done
          echo "giving up after 3 attempts"
          exit 1
