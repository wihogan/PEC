name: diag-multpl-fallback
on:
  push:
    branches: [multpl-fallback]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Six valuation fetches (no secrets)
        run: |
          python - <<'PY'
          import logging
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          from fetchers import shiller, multpl
          for sid in ["dividend_yield", "pe", "earnings_yield", "real_earnings", "nominal_earnings", "cape"]:
              try:
                  df = shiller.fetch(sid, "2026-06-01")
                  print(f"RESULT {sid} source_used={df.attrs['source_used']} provisional_from={df.attrs['provisional_from']}")
                  print(df.tail(4).to_string(index=False))
              except Exception as exc:
                  print(f"RESULT {sid} FAIL {exc}")
          print("NOTICE", repr(shiller.pending_notice()))
          try:
              m = multpl.fetch_live("shiller_pe", "2026-06-01")
              print("MULTPL_LIVE ok", m.tail(3).to_string(index=False))
          except Exception as exc:
              print("MULTPL_LIVE", exc)
          PY
